name: Weekly Data Refresh (COLD STANDBY)

# =============================================================================
# COLD STANDBY runner — comfyui-catalog/comfy-templates-standby
#
# Byte-identical workload to the PRIMARY runner
# (comfy-backend/comfy-templates-runner/.github/workflows/refresh.yml — see
# that file for the full design commentary), differing only in:
#   1. the RUNNER_REPO env below (state file goes to THIS repo)
#   2. this header block
#
# While the primary is healthy this workflow MUST STAY DISABLED at the
# GitHub level (Actions tab → … → Disable workflow, or the API call in
# the README) so the Monday/Tuesday crons never double-fire. Promoting
# this standby to primary = one API call (enable) — see README.md.
#
# It exists because: the trinitylivy personal account is
# startup_failure-blocked account-wide (comfy-templates KNOWN_ISSUES #27),
# so ALL compute must live in healthy orgs. The comfy-backend org carries
# the primary; this repo is the second healthy island (created
# 2026-09-19) for failover, private-repo workloads, or any extra
# compute/cron the project grows into.
# =============================================================================

on:
  schedule:
    - cron: "0 16 * * 1" # Monday 16:00 UTC (09:00 PDT / 08:00 PST)
    - cron: "7 17 * * 2" # Tuesday backstop (17:07 UTC, off-peak)
  workflow_dispatch: {}

concurrency:
  group: weekly-refresh
  cancel-in-progress: false # never kill a refresh mid-scrape

permissions: {} # GH_PAT does everything; the runner repo's own token needs nothing

jobs:
  refresh:
    name: Weekly upstream data refresh
    runs-on: ubuntu-latest
    timeout-minutes: 20 # pipeline ~2-3 min; generous ceiling for retries
    steps:
      - name: Check configuration
        env:
          HAS_PAT: ${{ secrets.GH_PAT != '' }}
        run: |
          if [ "$HAS_PAT" != "true" ]; then
            echo "::error::GH_PAT secret not configured on this repo."
            exit 1
          fi

      - name: Check out private comfy-templates repo
        uses: actions/checkout@v4
        with:
          repository: trinitylivy/comfy-templates
          token: ${{ secrets.GH_PAT }}
          path: comfy-templates
          # Full history so the race-safe rebase below has a real
          # merge-base (~12 MiB pack).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run 8-step refresh pipeline (01-07 + verify) and mirror to public/data
        working-directory: comfy-templates
        run: bash work/comfy-templates/scripts/cron/daily_refresh.sh

      - name: Post-refresh audit (7 structural checks)
        working-directory: comfy-templates
        run: python3 scripts/audit_refresh.py

      - name: Commit and push data changes (race-safe)
        working-directory: comfy-templates
        run: |
          set -euo pipefail
          git config user.name "trinitylivy"
          git config user.email "trinitylivy@gmail.com"
          # Scope strictly to pipeline outputs: raw + unified data and
          # the static mirror the web app serves. Logs, pidfiles and
          # lock files also live under work/comfy-templates and must
          # never be committed.
          git add work/comfy-templates/data public/data
          if git diff --cached --quiet; then
            echo "No data changes — upstream static since the last run"
            exit 0
          fi
          git commit -m "chore(data): weekly upstream refresh $(date -u +%Y-%m-%d)"
          # NOTE: checkout@v4 leaves the runner on a DETACHED HEAD, so a
          # bare `git push` fails — push the explicit refspec HEAD:main
          # instead (empirically verified on this pattern).
          # A push to main during this run (parallel agent sessions are
          # active on this repo) makes ours non-fast-forward. NEVER
          # force-push — rebase on origin/main and retry a few times.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "data commit pushed (attempt ${attempt})"
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "push attempt ${attempt} rejected — rebasing on origin/main, retrying"
              if ! git pull --rebase origin main; then
                echo "FATAL: rebase onto origin/main failed (conflict with a concurrent push?)"
                git rebase --abort 2>/dev/null || true
                exit 1
              fi
            fi
          done
          echo "FATAL: could not push the data commit after 3 attempts"
          exit 1

      - name: Runner-repo state (public observability; best-effort)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          RUNNER_REPO: comfyui-catalog/comfy-templates-standby
        run: |
          set -euo pipefail
          today="$(date -u +%F)"
          export TODAY="$today"
          python3 - << 'PYEOF' || echo "::warning::state commit failed (non-fatal)"
          import base64
          import json
          import os
          import urllib.request

          pat = os.environ["GH_PAT"]
          repo = os.environ["RUNNER_REPO"]
          today = os.environ["TODAY"]
          api = f"https://api.github.com/repos/{repo}/contents/state/last-run.json"

          def call(method, body=None):
              req = urllib.request.Request(
                  api, method=method, data=body,
                  headers={"Authorization": f"token {pat}",
                           "User-Agent": "comfy-templates-standby",
                           "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  raw = resp.read()
                  return resp.status, (json.loads(raw) if raw else {})

          sha, existing_date = "", ""
          try:
              _, d = call("GET")
              sha = d.get("sha", "")
              content = base64.b64decode(d.get("content", "")).decode()
              existing_date = json.loads(content).get("date", "")
          except Exception:
              pass  # 404 on first run — create mode

          if existing_date == today:
              print(f"state/last-run.json already records {today} — skipping.")
              raise SystemExit(0)

          payload = {
              "date": today,
              "purpose": "public observability: last successful data-refresh run "
                         "(cold-standby runner; primary is comfy-backend/comfy-templates-runner)",
          }
          body = json.dumps({
              "message": f"state: refresh ran on {today}",
              "content": base64.b64encode(
                  json.dumps(payload, indent=2).encode()).decode(),
          }).encode()
          if sha:
              body = json.loads(body.decode())
              body["sha"] = sha
              body = json.dumps(body).encode()
          call("PUT", body)
          print(f"state/last-run.json updated to {today}.")
          PYEOF
