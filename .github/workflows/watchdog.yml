name: Freshness Watchdog

# Production-freshness watchdog for comfy-templates.vercel.app
# (AR3 D2, 2026-09-27). Lives on the STANDBY runner repo on purpose:
#   * different org than the primary runner = cascade diversification
#     (a org-wide Actions problem cannot kill both the refresher and
#     the thing that watches it);
#   * keeps this (otherwise cold) repo's schedules warm;
#   * needs ZERO secrets — it fetches the PUBLIC prod stats.json.
#
# What it catches: every failure class ABOVE production — dead/rotted
# GH_PAT on the primary runner (the 2026-09-21 incident class: the
# then-scheduled Mon+Tue runs
# runs failed at checkout, prod froze, NOTHING alerted for ~5 days),
# Vercel deploy failures (incl. the commit-author trap), GitHub's
# 60-day schedule-inactivity auto-disable cascade, runner-repo
# deletion/wipe.
#
# TWO independent probes (W2-c P2-6, 2026-09-29):
#   1. prod freshness — comfy-templates.vercel.app/data/stats.json
#      built_at age (the user-visible signal);
#   2. PRIMARY RUNNER heartbeat — comfy-backend/comfy-templates-runner's
#      public state/last-run.json date. A stale state file with fresh
#      prod means the runner's state step is failing — the leading
#      indicator of the 60-day schedule-timer erosion (no commits to
#      the runner repo → GitHub eventually disables its schedules →
#      the weekly refresh dies → only then does prod go stale).
#
# Threshold math (W18 ramp-up, 2026-10-09, corrected r1): prod freshness
# comes from the Netlify daily 04:00 UTC fire (primary) + the GHA
# Wednesday/Thursday backup lane. Daily churn commits re-stamp built_at,
# so age > 26h means the daily contract is broken. Detection is
# quantized to the probes: with the 04:30 + 16:30 daily pair, a dead
# Netlify lane is caught at the SECOND probe past the last stamp —
# nominal ~36h, ~48-60h when the scheduler drops one probe (observed
# drop rate ~1/3), before the GHA Wednesday lane lands (which resets
# the clock but cannot satisfy a 26h daily contract alone — though the
# red → self-heal loop makes the GHA lane effectively take over the
# daily refresh while Netlify is down).
#
# The state/watchdog.json commit (step 2) is a HEARTBEAT, not
# best-effort: only commits keep a repo's schedules alive past GitHub's
# 60-day inactivity rule (runs do NOT count), so a failed heartbeat
# commit FAILS this run loudly (the alert step then fires).
#
# DRILL: workflow_dispatch with drill=true fails step 1 on purpose →
# the alert issue fires (cc @trinitylivy — the notification drill,
# proving the exact channel that was silent for 5 days) → a normal
# green dispatch (drill=false) auto-closes it.

on:
  schedule:
    # Daily 04:30 UTC — 30 min after the Netlify 04:00 daily fire
    # (W18 ramp-up: daily cadence landed 2026-10-09; this is the
    # Netlify-cron-unreliability catcher per DESIGN_W15 ramp-up spec).
    - cron: "30 4 * * *"
    # W18-r1: a SECOND daily probe at 16:30 UTC — one probe/day means a
    # single scheduler drop pushes detection from ~36h to ~72h; the pair
    # halves the quantization step (nominal ~36h, one-drop ~48-60h).
    - cron: "30 16 * * *"
    # Thursday 16:23 UTC kept as a third probe (belt-and-suspenders).
    - cron: "23 16 * * 4"
  workflow_dispatch:
    inputs:
      threshold:
        description: "Alert when prod built_at age exceeds this many DAYS (default 1.0833 = 26h)"
        type: number
        default: 1.0833
      drill:
        description: "Fail on purpose to drill the alert/notification loop"
        type: boolean
        default: false

concurrency:
  group: freshness-watchdog
  cancel-in-progress: false

permissions:
  issues: write # alert issue open/close/comment (own GITHUB_TOKEN)
  contents: write # state/watchdog.json heartbeat commit

jobs:
  watchdog:
    name: Check production data freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production freshness + primary-runner heartbeat
        id: check
        env:
          PROD_STATS_URL: https://comfy-templates.vercel.app/data/stats.json
          RUNNER_STATE_URL: https://raw.githubusercontent.com/comfy-backend/comfy-templates-runner/main/state/last-run.json
          # NOTE: the default lives in the python below, NOT in a
          # `${{ inputs.threshold || 8 }}` expression — that coerces an
          # explicit 0 to 8 (W2-c: the documented threshold-0 drill was
          # silently impossible; drill=true remains the red-drill path).
          THRESHOLD: ${{ inputs.threshold }}
          STATE_MAX_AGE: 2
          DRILL: ${{ inputs.drill || false }}
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import datetime
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          url = os.environ["PROD_STATS_URL"]
          # W18 ramp-up: daily cadence → 26h threshold (1.0833d). A red
          # here means the Netlify daily fire AND the GHA Wednesday/
          # Thursday lane were both missed within the last ~26h window.
          threshold = float(os.environ.get("THRESHOLD") or 1.0833)
          state_max_age = float(os.environ.get("STATE_MAX_AGE") or 2)
          drill = os.environ["DRILL"] == "true"

          if drill:
              print("DRILL MODE: failing on purpose to exercise the alert loop.")
              sys.exit(1)

          try:
              with urllib.request.urlopen(url, timeout=30) as resp:
                  stats = json.load(resp)
          except Exception as e:
              print(f"::error::could not fetch/parse prod stats.json "
                    f"({url}): {e}")
              sys.exit(1)

          built_at = stats.get("built_at")
          total = stats.get("total_workflows")
          if not built_at:
              print(f"::error::prod stats.json has no built_at field "
                    f"(payload shape drift?): {sorted(stats)[:10]}")
              sys.exit(1)

          try:
              built = datetime.datetime.fromisoformat(
                  built_at.replace("Z", "+00:00"))
          except ValueError as e:
              print(f"::error::prod built_at is not ISO-8601 ({built_at!r}): {e}")
              sys.exit(1)

          age_days = (datetime.datetime.now(datetime.timezone.utc)
                      - built).total_seconds() / 86400.0
          print(f"prod built_at={built_at} total={total} age={age_days:.2f}d "
                f"(threshold {threshold}d)")
          if age_days > threshold:
              print(f"::error::PRODUCTION DATA IS STALE: {age_days:.1f} days "
                    f"old (> {threshold}d) — no refresh in >26h. The Netlify "
                    f"daily fire is missing (check the site deploys + build "
                    f"hook first; a green weekly GHA run alone cannot satisfy "
                    f"the daily contract). Also check the primary runner's "
                    f"recent runs + GH_PAT secret, and the Vercel deploy.")
              sys.exit(1)

          # Probe 2 (W2-c P2-6): the PRIMARY runner's own heartbeat. A
          # stale/missing state file while prod is still fresh = the
          # state step is failing — the leading indicator of the 60-day
          # schedule-timer erosion on the runner repo.
          state_url = os.environ["RUNNER_STATE_URL"]
          try:
              with urllib.request.urlopen(state_url, timeout=30) as resp:
                  runner_state = json.load(resp)
              state_date = runner_state.get("date", "")
              state_age = (datetime.datetime.now(datetime.timezone.utc).date()
                           - datetime.date.fromisoformat(state_date)).days
              print(f"primary runner state: date={state_date} age={state_age}d "
                    f"(max {state_max_age:.0f}d)")
              if state_age > state_max_age:
                  print(f"::error::PRIMARY RUNNER HEARTBEAT STALE: "
                        f"state/last-run.json date {state_date} is {state_age}d "
                        f"old (> {state_max_age:.0f}d) while prod is fresh "
                        f"({age_days:.1f}d). The runner's state step is failing — "
                        f"fix it before GitHub's 60-day rule disables the "
                        f"runner repo's schedules (then the weekly refresh "
                        f"itself dies).")
                  sys.exit(1)
          except urllib.error.URLError as e:
              print(f"::error::PRIMARY RUNNER HEARTBEAT MISSING: could not "
                    f"fetch {state_url}: {e}. If this persists, the primary "
                    f"runner's state step (or the whole repo) is gone.")
              sys.exit(1)
          except (ValueError, KeyError) as e:
              print(f"::error::PRIMARY RUNNER HEARTBEAT UNPARSEABLE: {e} "
                    f"(payload shape drift in state/last-run.json?)")
              sys.exit(1)

          # Probe 3 (W18): the tertiary Blobs lane. state/last-run.json's
          # blobs_snapshot field carries the LAST run's outcome. "failed"
          # = the blobs step ran and red (dead token / store) → red here
          # too (same-day detection WITHOUT coupling primary availability
          # to tertiary storage — the DESIGN_W15 "promote to fatal" idea,
          # amended in W18: watchdog-detect instead of pipeline-fatal).
          # "skipped_no_secrets" after 2026-10-09 = a secret regression
          # (NETLIFY_AUTH_TOKEN/SITE_ID deleted) → red. "skipped_no_push"
          # is a legitimate per-run skip → warning only.
          blobs = runner_state.get("blobs_snapshot", "")
          if blobs == "failed":
              print(f"::error::BLOBS LANE FAILING: the last refresh run's "
                    f"blobs_snapshot = 'failed' (Netlify Blobs tertiary "
                    f"backup not landing — check NETLIFY_AUTH_TOKEN / "
                    f"NETLIFY_SITE_ID on the runner repo and the blobs "
                    f"store quota).")
              sys.exit(1)
          if blobs == "skipped_no_secrets":
              print(f"::error::BLOBS LANE MISCONFIGURED: blobs_snapshot = "
                    f"'skipped_no_secrets' but the secrets were set "
                    f"2026-10-09 — NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID "
                    f"were deleted or renamed on the runner repo.")
              sys.exit(1)
          if blobs:
              print(f"blobs lane: {blobs}")
          print("freshness OK")
          PYEOF

      - name: Heartbeat (state/watchdog.json commit — keeps schedules alive)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_REPO: comfyui-catalog/comfy-templates-standby
          PROD_STATS_URL: https://comfy-templates.vercel.app/data/stats.json
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import base64
          import datetime
          import json
          import os
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["RUNNER_REPO"]
          today = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          api = f"https://api.github.com/repos/{repo}/contents/state/watchdog.json"

          # best-effort prod snapshot for the breadcrumb
          built_at, total = None, None
          try:
              with urllib.request.urlopen(
                      os.environ["PROD_STATS_URL"], timeout=30) as resp:
                  stats = json.load(resp)
              built_at = stats.get("built_at")
              total = stats.get("total_workflows")
          except Exception:
              pass

          def call(method, body=None):
              req = urllib.request.Request(
                  api, method=method, data=body,
                  headers={"Authorization": f"token {token}",
                           "User-Agent": "freshness-watchdog",
                           "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  raw = resp.read()
                  return resp.status, (json.loads(raw) if raw else {})

          sha = ""
          try:
              _, d = call("GET")
              sha = d.get("sha", "")
              content = base64.b64decode(d.get("content", "")).decode()
              if json.loads(content).get("date") == today:
                  print(f"state/watchdog.json already records {today} — skipping.")
                  raise SystemExit(0)
          except SystemExit:
              raise
          except Exception:
              pass  # 404 on first run — create mode

          payload = {
              "date": today,
              "prod_built_at": built_at,
              "prod_total_workflows": total,
              "purpose": "watchdog heartbeat: keeps this repo's schedules "
                         "past GitHub's 60-day inactivity rule and exposes "
                         "the last observed prod freshness",
          }
          body = json.dumps({
              "message": f"watchdog heartbeat {today}",
              "content": base64.b64encode(
                  json.dumps(payload, indent=2).encode()).decode(),
          }).encode()
          if sha:
              body = json.loads(body.decode())
              body["sha"] = sha
              body = json.dumps(body).encode()
          call("PUT", body)
          print(f"state/watchdog.json updated to {today}.")
          PYEOF

      - name: Self-heal (dispatch the primary refresh — W18 ramp-up)
        # When the check reds, the daily lanes are all stale — dispatch
        # the primary GHA refresh directly (Netlify cron unreliability /
        # a dead GHA schedule both heal through this). The standby's
        # GH_PAT (verified to carry workflow-dispatch scope 2026-10-09)
        # does the POST. Best-effort: the alert step still fires, and
        # the next day's watchdog re-checks.
        # W18-r1 P2: scoped to the CHECK step's failure only — a failed
        # heartbeat (this repo's commit problem) or a deliberate drill
        # must NOT dispatch a production refresh.
        if: failure() && steps.check.outcome == 'failure' && inputs.drill != true
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          PRIMARY_REPO: comfy-backend/comfy-templates-runner
        run: |
          set -euo pipefail
          if [ -z "${GH_PAT}" ]; then
            echo "::warning::GH_PAT secret not set on this repo — cannot self-heal-dispatch"
            exit 0
          fi
          code=$(curl -s -o /tmp/heal.json -w "%{http_code}" -X POST \
            -H "Authorization: token ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${PRIMARY_REPO}/actions/workflows/refresh.yml/dispatches" \
            -d '{"ref":"main"}')
          if [ "$code" = "204" ]; then
            echo "self-heal: dispatched the primary refresh (HTTP 204)"
          else
            echo "::warning::self-heal dispatch failed (HTTP ${code}): $(head -c 200 /tmp/heal.json)"
          fi

      - name: Alert on failure (open/comment alert issue)
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_REPO: comfyui-catalog/comfy-templates-standby
          ALERT_LABEL: freshness-alert
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import datetime
          import json
          import os
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["RUNNER_REPO"]
          label = os.environ["ALERT_LABEL"]
          run_url = os.environ["RUN_URL"]
          marker = "<!-- bot: freshness-alert -->"

          def call(method, path, body=None):
              req = urllib.request.Request(
                  f"https://api.github.com{path}", method=method, data=body,
                  headers={"Authorization": f"token {token}",
                           "User-Agent": "freshness-watchdog",
                           "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  raw = resp.read()
                  return resp.status, (json.loads(raw) if raw else {})

          try:
              call("GET", f"/repos/{repo}/labels/{label}")
          except Exception:
              call("POST", f"/repos/{repo}/labels", json.dumps({
                  "name": label, "color": "b60205",
                  "description": "automated prod-freshness alert",
              }).encode())

          _, issues = call(
              "GET", f"/repos/{repo}/issues?labels={label}&state=open")
          open_alerts = [i for i in issues if marker in (i.get("body") or "")]

          body_text = (
              f"{marker}\n"
              f"**Freshness watchdog FAILED** — production data freshness "
              f"is at risk. Read the red step's `::error::` line for the "
              f"exact class, then triage:\n\n"
              f"- Watchdog run: {run_url}\n"
              f"- Job status: `{os.environ['JOB_STATUS']}`  |  "
              f"Time (UTC): {datetime.datetime.now(datetime.timezone.utc).isoformat()}\n\n"
              f"| Red step message | Likely cause | Fix |\n"
              f"|---|---|---|\n"
              f"| PRODUCTION DATA IS STALE | no refresh in >26h — the "
              f"Netlify daily fire is missing (GHA weekly may be green) | "
              f"check the Netlify site's deploys + build hook, then the "
              f"primary runner's "
              f"recent runs + its `GH_PAT` secret (the 2026-09-21 "
              f"incident class; fix = `set-secret.py` on BOTH runner "
              f"repos), then the Vercel deploy (commit author rule) |\n"
              f"| PRIMARY RUNNER HEARTBEAT STALE/MISSING | the runner's "
              f"state step is failing while prod still looks fresh | fix "
              f"the state step before the 60-day rule disables the runner "
              f"repo's schedules |\n"
              f"| BLOBS LANE FAILING | the tertiary Netlify Blobs backup "
              f"step red on the last refresh run | check "
              f"`NETLIFY_AUTH_TOKEN` / `NETLIFY_SITE_ID` on the runner "
              f"repos and the blobs store; the data refresh itself is "
              f"NOT blocked (warning-class by design, W18 amendment) |\n"
              f"| BLOBS LANE MISCONFIGURED | blobs_snapshot = "
              f"skipped_no_secrets after secrets were set 2026-10-09 | "
              f"re-set the secrets via `set-secret.py` |\n"
              f"| heartbeat commit failed | THIS repo's own "
              f"state/watchdog.json commit failed | fix this repo's push "
              f"permissions (it is the 60-day timer for the watchdog "
              f"itself) |\n\n"
              f"A self-heal dispatch of the primary refresh was attempted "
              f"(see the run log above).\n\n"
              f"cc @trinitylivy"
          )

          if not open_alerts:
              call("POST", f"/repos/{repo}/issues", json.dumps({
                  "title": "Freshness watchdog FAILED — action required",
                  "body": body_text,
                  "labels": [label],
              }).encode())
              print("alert issue CREATED")
          else:
              call("POST",
                   f"/repos/{repo}/issues/{open_alerts[0]['number']}/comments",
                   json.dumps({"body": body_text}).encode())
              print(f"alert issue #{open_alerts[0]['number']} COMMENTED")
          PYEOF

      - name: Resolve alert on success (auto-close bot alerts)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_REPO: comfyui-catalog/comfy-templates-standby
          ALERT_LABEL: freshness-alert
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import json
          import os
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["RUNNER_REPO"]
          label = os.environ["ALERT_LABEL"]
          run_url = os.environ["RUN_URL"]
          marker = "<!-- bot: freshness-alert -->"

          def call(method, path, body=None):
              req = urllib.request.Request(
                  f"https://api.github.com{path}", method=method, data=body,
                  headers={"Authorization": f"token {token}",
                           "User-Agent": "freshness-watchdog",
                           "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  raw = resp.read()
                  return resp.status, (json.loads(raw) if raw else {})

          try:
              _, issues = call(
                  "GET", f"/repos/{repo}/issues?labels={label}&state=open")
          except Exception as e:
              print(f"label search failed (label may not exist yet): {e}")
              raise SystemExit(0)

          closed = 0
          for issue in issues:
              if marker not in (issue.get("body") or ""):
                  continue
              call("POST",
                   f"/repos/{repo}/issues/{issue['number']}/comments",
                   json.dumps({"body": (
                       f"Recovered: prod is fresh again (green watchdog "
                       f"run {run_url}) — alert auto-closed."
                   )}).encode())
              call("PATCH", f"/repos/{repo}/issues/{issue['number']}",
                   json.dumps({"state": "closed"}).encode())
              closed += 1
          print(f"resolved {closed} alert issue(s)")
          PYEOF
